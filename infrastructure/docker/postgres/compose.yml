services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: bwes-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: bwes
      POSTGRES_USER: bwes
      POSTGRES_PASSWORD: bwes_local_dev
      TZ: UTC
      PGTZ: UTC

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - bwes_postgres_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bwes -d bwes"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  bwes_postgres_data:
    name: bwes_postgres_data
