services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: bwes-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: bwes
      POSTGRES_USER: bwes
      POSTGRES_PASSWORD: bwes_local_dev
      TZ: UTC
      PGTZ: UTC

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - bwes_postgres_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bwes -d bwes"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  directus:
    image: directus/directus:12.4.1
    container_name: bwes-directus
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SECRET: ${DIRECTUS_SECRET}

      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: bwes_directus
      DB_USER: bwes
      DB_PASSWORD: bwes_local_dev

      PUBLIC_URL: http://localhost:8055

    ports:
      - "127.0.0.1:8055:8055"

    volumes:
      - bwes_directus_uploads:/directus/uploads

volumes:
  bwes_postgres_data:
    name: bwes_postgres_data
  bwes_directus_uploads:
    name: bwes_directus_uploads
