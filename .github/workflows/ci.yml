name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: bwes
          POSTGRES_PASSWORD: bwes_local_dev
          POSTGRES_DB: bwes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bwes -d bwes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bwes:bwes_local_dev@localhost:5432/bwes
      TEST_DATABASE_URL: postgresql://bwes:bwes_local_dev@localhost:5432/bwes_test
      API_HOST: 0.0.0.0
      API_PORT: 4000
      API_CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test database
        run: |
          PGPASSWORD=bwes_local_dev psql \
            -h localhost \
            -U bwes \
            -d postgres \
            -c "CREATE DATABASE bwes_test OWNER bwes;"

      - name: Apply development database migrations
        run: |
          pnpm --filter @bwes/database exec prisma migrate deploy

      - name: Apply test database migrations
        run: pnpm db:test:migrate

      - name: Verify repository
        run: pnpm verify
